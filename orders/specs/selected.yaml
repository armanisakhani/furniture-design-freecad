# main: misty, second: brown — see furniture/*/example.yaml for every
# other overridable parameter, and furniture/*/styles.yaml for style names.
#
# View: tools/order.sh misty_brown
# Cutlist report: tools/order.sh misty_brown --report

colors:
  main: misty
  second: cuppuccino

items:
  - furniture: bed
    qty: 1
    # part_roles reassigns which of main/second/reused a named part uses,
    # just for this item — see furniture/bed/part_roles.yaml for every
    # part name + its own project-wide default.
    part_roles:
      box_top: second
      box_body: second
      box_edge_band: second
      drawer_face: main
      headboard: second
      end_face_foot: second
      mattress_stop: second

  - furniture: dresser
    qty: 1
    drawer_color_pattern: "0111"
    width: 850
    has_mirror: true
    gap_after: 0
    # part_roles reassigns which of main/second/reused a named part uses,
    # just for this item — see furniture/dresser/part_roles.yaml for
    # every part name + its own project-wide default.
    part_roles:
      left: main
      right: main
      top: main
      bottom: reused
      back: reused
      mirror_frame: main
  - furniture: wardrobe
    qty: 1
    style: two-piece
    color_pattern: "1_0111"
    width: 850
    # one '1'(main)/'0'(second) digit per side shelf, top to bottom — same
    # convention as color_pattern's own drawer digits, independent of
    # part_roles (two_piece only).
    side_shelf_color_pattern: "111"
    # part_roles reassigns which of main/second/reused a named part uses,
    # just for this item — see furniture/wardrobe/part_roles.yaml for
    # every part name + its own project-wide default. bottom_top/
    # hanging_bottom are the 2 panels sandwiched at the seam between the
    # stacked units (two_piece only) — their own exposed cut-edge always
    # matches "main" regardless (hardcoded, not one of these roles).
    part_roles:
      left: main
      right: main
      top: reused
      bottom: reused
      back: reused
      bottom_top: reused
      hanging_bottom: reused
