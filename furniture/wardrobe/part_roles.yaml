# Which color role (main/second/reused — see colors.py's MAIN_COLOR/
# SECOND_COLOR/REUSED_MDF_COLOR) each named part uses, project-wide — the
# single place answering "what color is X". Edit here to move a part to a
# different role; nothing else needs to change.
#
# Any part here can also be overridden independently for just one order,
# without touching this file, via that part's own <PART>_SWATCH env var —
# an order item's own <part>_swatch key becomes that env var, e.g.
# `left_swatch: brown` colors just the left side panel(s) brown for that
# one order, leaving this file's own left: main untouched for every other
# order.

left: main         # Left/BottomLeft/HangingLeft side panels (wardrobe.py), both layouts
right: main        # Right/BottomRight/HangingRight side panels
top: main          # Top/HangingTop/Divider — the truly visible, new-stock ceiling/divider panels
bottom: reused     # Bottom Panel — hidden base, cut from reclaimed stock by default
back: reused       # Back/BottomBack/HangingBack — hidden, assumed against a wall, both layouts

# Side shelf boards (two_piece only) are NOT one of these roles — each
# one's own color comes from params.py's SIDE_SHELF_COLOR_PATTERN
# instead, a '1'(main)/'0'(second) digit per shelf (top to bottom), same
# convention as DRAWER_COLOR_PATTERN — see furniture/wardrobe/example.yaml.

# BottomTop/HangingBottom (two_piece only) sandwich together at the seam
# between the 2 stacked units — their own big flat faces (top/bottom) are
# hidden inside that sandwich (never actually seen), so they're free to be
# cut from reclaimed stock like any other hidden panel; only their own
# cut-edge perimeter is exposed right at the seam, and that ALWAYS matches
# "main" (hardcoded in wardrobe.py, not one of these roles) regardless of
# what these 2 are set to — see core/panel.py's EdgeColor, colored
# independently of the body/PanelColor these 2 roles govern.
bottom_top: reused       # Bottom Unit - Top Panel's own hidden body
hanging_bottom: reused   # Hanging Unit - Bottom's own hidden body
